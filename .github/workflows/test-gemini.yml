name: Test Gemini Translation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-translation:
    runs-on: ubuntu-latest

    steps:
      - name: Translate Chinese to English
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl -sS \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{
              "contents": [
                {
                  "parts": [
                    {
                      "text": "Translate the following Chinese sentence into natural English. Return only the translation, without explanations:\n\nC语言中的字符串以空字符结尾。"
                    }
                  ]
                }
              ]
            }'
