name: Test Gemini API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gemini:
    runs-on: ubuntu-latest

    steps:
      - name: List available Gemini models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl -i -sS "https://generativelanguage.googleapis.com/v1beta/models?key=${GEMINI_API_KEY}"
