name: Test Gemini API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gemini:
    runs-on: ubuntu-latest

    steps:
      - name: Test Gemini translation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{
              "contents": [
                {
                  "parts": [
                    {
                      "text": "Translate this sentence into English. Return only the translation: C语言中的字符串以空字符结尾。"
                    }
                  ]
                }
              ]
            }'
