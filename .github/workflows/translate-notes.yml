name: Translate Obsidian Notes

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '!translations/**'
      - 'scripts/translate_notes.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Run translation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 移除 git diff，直接全量运行，依靠 Python 内部的 MD5 缓存来识别需要翻译的文件
          # 这样可以确保上次因 API 报错而失败的文件，在下一次 actions 运行时会被重新处理
          python3 scripts/translate_notes.py

      - name: Check for changes
        id: changes
        run: |
          # 必须先 add, 因为 translation_cache.json 可能是新建的未追踪文件
          git add translations
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit translations
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update translations and cache"
          git push
