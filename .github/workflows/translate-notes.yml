name: Translate Obsidian Notes

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '!translations/**'
      - 'scripts/translate_notes.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Run translation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/translate_notes.py
        # 允许脚本因少数文件翻译失败而退出，保障后续的 commit 步骤能正常保存已成功的进度
        continue-on-error: true

      - name: Check for changes
        id: changes
        run: |
          # add translations 文件夹（包含新建的缓存和翻译文件），再进行 diff 判断
          git add translations
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit translations
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update translations and cache"
          git push
